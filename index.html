
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Latest Videos</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:white;
}

header{
background:#ff0000;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#1d1d1d;
border-radius:15px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:scale(1.03);
}

iframe{
width:100%;
height:220px;
border:none;
}

.info{
padding:15px;
}

.info h2{
font-size:18px;
margin-bottom:8px;
}

.info p{
color:#bbb;
}

footer{
text-align:center;
padding:20px;
color:#888;
}
</style>

</head>

<body>

<header>
Latest Videos
</header>

<div class="container">

<div class="card">
<iframe src="https://www.youtube.com/embed/ysz5S6PUM-U" allowfullscreen></iframe>
<div class="info">
<h2>Latest Video 1</h2>
<p>Watch the newest upload.</p>
</div>
</div>

<div class="card">
<iframe src="https://www.youtube.com/embed/ScMzIvxBSi4" allowfullscreen></iframe>
<div class="info">
<h2>Latest Video 2</h2>
<p>Trending now.</p>
</div>
</div>

<div class="card">
<iframe src="https://www.youtube.com/embed/jNQXAC9IVRw" allowfullscreen></iframe>
<div class="info">
<h2>Latest Video 3</h2>
<p>Popular video.</p>
</div>
</div>

<div class="card">
<iframe src="https://www.youtube.com/embed/LXb3EKWsInQ" allowfullscreen></iframe>
<div class="info">
<h2>Latest Video 4</h2>
<p>Editor's choice.</p>
</div>
</div>

</div>

<footer>
© 2026 Latest Videos
</footer>

</body>
</html>
